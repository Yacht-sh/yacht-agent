name: Verify And Publish Agent Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: agent-image-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-agent:
    name: Verify Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir bandit pip-audit

      - name: Compile agent sources
        run: python -m compileall agent

      - name: Run Bandit on agent
        run: bandit -q -r agent

      - name: Audit agent dependencies
        run: pip-audit -r agent/requirements.txt --progress-spinner=off

  publish-agent-image:
    name: Publish Agent Image
    runs-on: ubuntu-latest
    needs:
      - verify-agent
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: prep
        run: |
          short_sha="${GITHUB_SHA::12}"
          {
            echo "channel_tag=latest"
            echo "version_tag=sha-${short_sha}"
            echo "app_version=${short_sha}"
            echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner_lc }}/yacht-agent
          tags: |
            type=raw,value=${{ steps.prep.outputs.channel_tag }}
            type=raw,value=${{ steps.prep.outputs.version_tag }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show GHCR auth context
        run: |
          echo "GHCR auth mode: GITHUB_TOKEN"
          echo "GHCR auth user: ${{ github.actor }}"
          echo "Target image: ghcr.io/${{ steps.prep.outputs.owner_lc }}/yacht-agent"

      - name: Verify GHCR access for agent image package
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_IMAGE_REPO: ${{ steps.prep.outputs.owner_lc }}/yacht-agent
        run: |
          registry_status_code="$(curl -sS -o /tmp/ghcr_registry_body.txt -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            -u "${GHCR_USERNAME}:${GHCR_TOKEN}" \
            "https://ghcr.io/v2/")"

          if [ "${registry_status_code}" != "200" ]; then
            echo "GHCR registry preflight failed with status ${registry_status_code}."
            echo "The registry rejected credentials before package checks."
            cat /tmp/ghcr_registry_body.txt || true
            exit 1
          fi

          package_status_code="$(curl -sS -o /tmp/ghcr_package_body.txt -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            -u "${GHCR_USERNAME}:${GHCR_TOKEN}" \
            "https://ghcr.io/v2/${GHCR_IMAGE_REPO}/tags/list?n=1")"

          case "${package_status_code}" in
            200|404)
              echo "GHCR package preflight passed with status ${package_status_code}."
              ;;
            401|403)
              echo "GHCR package preflight failed with status ${package_status_code}."
              echo "Repository '${{ github.repository }}' does not have package write access to ghcr.io/${GHCR_IMAGE_REPO}."
              echo "Ensure package access is granted and this workflow has packages:write for GHCR."
              cat /tmp/ghcr_package_body.txt || true
              exit 1
              ;;
            *)
              echo "Unexpected GHCR package preflight status: ${package_status_code}"
              cat /tmp/ghcr_package_body.txt || true
              exit 1
              ;;
          esac

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=agent-image-${{ github.ref_name }}
          provenance: mode=max
          sbom: true
