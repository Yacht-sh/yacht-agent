name: Verify And Publish Agent Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: agent-image-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-agent:
    name: Verify Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir bandit pip-audit

      - name: Compile agent sources
        run: python -m compileall agent

      - name: Run Bandit on agent
        run: bandit -q -r agent
        continue-on-error: true

      - name: Audit agent dependencies
        run: pip-audit -r agent/requirements.txt --progress-spinner=off
        continue-on-error: true

  publish-agent-image:
    name: Publish Agent Image
    runs-on: ubuntu-latest
    needs:
      - verify-agent
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: prep
        run: |
          short_sha="${GITHUB_SHA::12}"
          {
            echo "channel_tag=latest"
            echo "version_tag=sha-${short_sha}"
            echo "app_version=${short_sha}"
            echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner_lc }}/yacht-agent
          tags: |
            type=raw,value=${{ steps.prep.outputs.channel_tag }}
            type=raw,value=${{ steps.prep.outputs.version_tag }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show GHCR auth context
        run: |
          echo "GHCR auth mode: GITHUB_TOKEN"
          echo "GHCR auth user: ${{ github.actor }}"
          echo "Target image: ghcr.io/${{ steps.prep.outputs.owner_lc }}/yacht-agent"

      - name: Verify GHCR access for agent image package
        run: |
          echo "GHCR access verified via docker/login-action above"
          echo "Target image: ghcr.io/${{ steps.prep.outputs.owner_lc }}/yacht-agent"

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=agent-image-${{ github.ref_name }}
          provenance: mode=max
          sbom: true
